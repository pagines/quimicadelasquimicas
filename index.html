var GL=[["Átomo", "Núcleo (protones +, neutrones) rodeado de electrones (−). Un átomo neutro tiene igual número de protones y electrones.", "m0"], ["Electrones de valencia", "Los electrones de la capa externa: los que participan en los enlaces. Se leen del grupo de la tabla periódica.", "m0"], ["Enlace covalente", "Dos átomos <i>comparten</i> electrones. Un par compartido = enlace sencillo (—); dos pares = doble (=); tres = triple (≡).", "m0"], ["Par libre (no compartido)", "Par de electrones que pertenece a un solo átomo y no forma enlace; se dibuja como dos puntos.", "m0"], ["Molécula / ion", "Molécula: grupo de átomos unidos, neutro. Ion: especie con carga (catión +, anión −).", "m0"], ["Electronegatividad", "Qué tanto \"jala\" un átomo los electrones que comparte. Aumenta hacia la derecha y hacia arriba en la tabla.", "m0"], ["Estructura (fórmula) de Lewis", "Dibujo que muestra todos los enlaces y todos los pares libres de una molécula.", "m1"], ["Regla del octeto", "Cada átomo (salvo H) queda rodeado de 8 electrones contando enlaces (2 e⁻ cada uno) y pares libres.", "m1"], ["Carga formal", "Contabilidad: compara los electrones que un átomo \"posee\" en la estructura con los que tiene un átomo neutro. Es una carga asignada por convención, ayuda a saber dónde está la carga.", "m1"], ["Carga neta", "Suma de las cargas formales = carga de la molécula o ion completo.", "m1"], ["Isoelectrónicos", "Especies con el mismo número de electrones (y aquí, mismo arreglo de enlaces).", "m1"], ["Electrones π", "Los electrones del segundo y tercer enlace de un doble/triple enlace. Son más \"móviles\" que los de un enlace sencillo.", "m2"], ["Deslocalización", "Electrones repartidos sobre varios átomos en lugar de fijos en uno.", "m2"], ["Contribuyente (estructura) de resonancia", "Cada una de las estructuras de Lewis válidas que juntas describen una especie.", "m2"], ["Híbrido de resonancia", "La especie real: un \"promedio\" de sus contribuyentes. Es más estable que cualquiera , al ganarlo, se convierte en su ácido conjugado.", "m5"], ["Ka", "Constante de equilibrio de un ácido en agua: qué tanto se disocia. Ka grande = ácido fuerte.", "m5"], ["pKa", "pKa = −log Ka. Menor pKa = ácido más fuerte. Cada unidad de pKa = factor 10 en Ka.", "m5"], ["Equilibrio (K)", "La reacción va y viene; K &gt; 1 significa que los productos dominan.", "m5"], ["Mecanismo", "Descripción paso a paso de cómo se mueven los electrones en una reacción.", "m6"], ["Equilibrio ⇌", "Doble flecha (dos medias puntas): la reacción es reversible.", "m6"], ["Base de Lewis", "Especie que <b>dona</b> un par de electrones (siempre tiene un par libre o un π).", "m7"], ["Ácido de Lewis", "Especie que <b>acepta</b> un par de electrones (tiene un \"hueco\").", "m7"], ["Nucleófilo / electrófilo", "Base de Lewis que ataca un átomo de carbono / el átomo que recibe el ataque.", "m7"]];
var STEPS={m0:{title:'Los ladrillos de la química orgánica',objetivo:'<p>Vas a aprender el vocabulario mínimo para poder leer cualquier molécula: qué es un átomo, un enlace y por qué cada elemento hace un número fijo de enlaces. Sin esto, nada de lo que sigue tiene sentido.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Átomo</dt><dd>Núcleo (protones +, neutrones) rodeado de electrones (−). Un átomo neutro tiene igual número de protones y electrones.</dd> <dt>Electrones de valencia</dt><dd>Los electrones de la capa externa: los que participan en los enlaces. Se leen del grupo de la tabla periódica.</dd> <dt>Enlace covalente</dt><dd>Dos átomos <i>comparten</i> electrones. Un par compartido = enlace sencillo (—); dos pares = doble (=); tres = triple (≡).</dd> <dt>Par libre (no compartido)</dt><dd>Par de electrones que pertenece a un solo átomo y no forma enlace; se dibuja como dos puntos.</dd> <dt>Molécula / ion</dt><dd>Molécula: grupo de átomos unidos, neutro. Ion: especie con carga (catión +, anión −).</dd> <dt>Electronegatividad</dt><dd>Qué tanto "jala" un átomo los electrones que comparte. Aumenta hacia la derecha y hacia arriba en la tabla.</dd></dl></div> <div class="tw"><table><tr><th>Átomo</th><th>H</th><th>C</th><th>N</th><th>O</th><th>F</th><th>Cl</th><th>Br</th><th>I</th><th>S</th></tr><tr><td>e⁻ de valencia</td><td>1</td><td>4</td><td>5</td><td>6</td><td>7</td><td>7</td><td>7</td><td>7</td><td>6</td></tr><tr><td>Enlaces que suele hacer (neutro)</td><td>1</td><td>4</td><td>3</td><td>2</td><td>1</td><td>1</td><td>1</td><td>1</td><td>2</td></tr><tr><td>Electronegatividad</td><td>2.1</td><td>2.5</td><td>3.0</td><td>3.5</td><td>4.0</td><td>3.0</td><td>2.8</td><td>2.5</td><td>2.5</td></tr></table></div>',intuicion:'<p><b>Idea en simple.</b> Los átomos "quieren" una capa externa completa: 8 electrones (<i>regla del octeto</i>), o 2 en el caso del H. Los logran compartiendo. Por eso cada átomo hace un número característico de enlaces: los electrones que le <i>faltan</i> para llegar a 8. O tiene 6 → le faltan 2 → hace 2 enlaces. N tiene 5 → 3 enlaces. C tiene 4 → 4 enlaces. Si memorizas la tabla anterior, ya sabes dibujar el 80 % de las moléculas orgánicas.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: agua, H₂O</b>O necesita 2 enlaces y cada H necesita 1: H–O–H. Al O le sobran 4 electrones que no enlazan = 2 pares libres. Cuenta: 2 enlaces (4 e⁻) + 2 pares libres (4 e⁻) = 8 ✔ octeto.</div>',profundizacion:'',comprueba:'<div class="b rec"><b class="t">Comprueba</b>¿Cuántos enlaces hace N en NH₃ y cuántos pares libres le quedan? <details><summary>Respuesta</summary>3 enlaces (con 3 H) y 1 par libre: 5 e⁻ de valencia − 3 usados en enlaces = 2 e⁻ = 1 par.</details></div>',aplicacion:''},m1:{title:'Estructuras de Lewis y carga formal',objetivo:'<p>Vas a aprender a dibujar cualquier molécula pequeña repartiendo bien sus electrones, y a detectar si algún átomo quedó con carga.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Estructura (fórmula) de Lewis</dt><dd>Dibujo que muestra todos los enlaces y todos los pares libres de una molécula.</dd> <dt>Regla del octeto</dt><dd>Cada átomo (salvo H) queda rodeado de 8 electrones contando enlaces (2 e⁻ cada uno) y pares libres.</dd> <dt>Carga formal</dt><dd>Contabilidad: compara los electrones que un átomo "posee" en la estructura con los que tiene un átomo neutro. Es una carga asignada por convención, ayuda a saber dónde está la carga.</dd> <dt>Carga neta</dt><dd>Suma de las cargas formales = carga de la molécula o ion completo.</dd> <dt>Isoelectrónicos</dt><dd>Especies con el mismo número de electrones (y aquí, mismo arreglo de enlaces).</dd></dl></div> <div class="b rule"><b class="t">Método para dibujar (5 pasos)</b><ol> <li>Cuenta los electrones de valencia totales (suma de átomos; +1 por cada carga negativa, −1 por cada positiva).</li> <li>Arma el esqueleto (átomo menos electronegativo al centro; H nunca al centro) y une con enlaces sencillos.</li> <li>Completa el octeto de los átomos externos con pares libres.</li> <li>Pon los electrones que sobren en el átomo central.</li> <li>Si al central le faltan electrones, convierte pares libres vecinos en enlaces dobles o triples.</li></ol> <div class="f">Carga formal = (e⁻ de valencia) − (e⁻ en pares libres) − (número de enlaces) Suma de cargas formales = carga neta</div>Atajo: un enlace de más que lo habitual → +1; un par libre de más → −1.</div>',intuicion:'<p><b>Idea en simple.</b> Dibujar una estructura de Lewis es repartir los electrones disponibles para que todos los átomos queden con octeto. La carga formal es la "auditoría": ¿el átomo tiene lo que le tocaría?</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: HCN</b>1) e⁻: 1+4+5 = 10. 2) Esqueleto H–C–N: 2 enlaces (4 e⁻). 3) N recibe 3 pares libres (6 e⁻): van 10, pero C solo tiene 4 e⁻. 5) Convierto 2 pares del N en enlaces: H–C≡N: (H: 1 enlace; C: 4 enlaces; N: 3 enlaces + 1 par). Cargas: H 1−0−1 = 0; C 4−0−4 = 0; N 5−2−3 = 0. Neutra ✔.</div> <div class="b ex"><b class="t">Ejemplo: ion cianuro :C≡N:⁻</b>C: 4 − 2 (un par) − 3 = <b>−1</b>; N: 5 − 2 − 3 = <b>0</b>. Suma = −1 = carga del ion ✔.</div>',profundizacion:'<div class="b err"><b class="t">Error típico</b>Contar el triple enlace como 6 en la fórmula. Se cuenta el <i>número de enlaces</i> (3), no los electrones (6): la fórmula ya divide entre 2.</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>Carga formal de O con 3 enlaces y 1 par libre: <details><summary>Respuesta</summary>6 − 2 − 3 = +1 (como en H₃O⁺).</details></div>',aplicacion:'<h3>Contexto: cómo aparece en el taller</h3> <p>Te piden dibujar Lewis (1.41a, 1.42) y decir dónde hay carga formal (1.40). Todo se resuelve con los 5 pasos y la fórmula anterior.</p> <div class="pb"><span class="id">1.40</span> Especies isoelectrónicas: cargas formales y carga neta de a) :N≡N: b) :C≡N: c) :C≡C: d) :N≡O: e) :C≡O: <details><summary>Resolución paso a paso</summary><ol><li>Todas tienen un par libre en cada extremo y un triple enlace (3 enlaces por átomo).</li><li>Aplica: carga = valencia − 2 − 3 = valencia − 5.</li><li>N (5): 0. C (4): −1. O (6): +1.</li><li>a) N 0, N 0 → neta 0. b) C −1, N 0 → −1. c) C −1, C −1 → −2. d) N 0, O +1 → +1. e) C −1, O +1 → 0.</li></ol>Lectura: el átomo con menos electrones de valencia recibe el "sobrante" (−1); el que tiene 6 se queda con un enlace de más (+1).</details></div> <div class="pb"><span class="id">1.41a</span> Lewis del OCS (conectividad O–C–S). <details><summary>Resolución paso a paso</summary><ol><li>e⁻: 6+4+6 = 16.</li><li>Esqueleto O–C–S: 2 enlaces (4 e⁻).</li><li>Completa octetos externos: 3 pares en O y 3 en S = 12 e⁻. Total 16 ✔ pero C solo tiene 4 e⁻.</li><li>Convierte un par de O y uno de S en enlaces: <b>:Ö=C=S̈:</b>.</li><li>Verifica cargas: O 6−4−2 = 0; C 4−0−4 = 0; S 6−4−2 = 0.</li></ol></details></div> <div class="pb"><span class="id">1.42</span> Lewis de a) C₂H₃Cl b) C₂HBrClF₃ c) C₂Cl₂F₄ <details><summary>Resolución paso a paso</summary><ol><li>Cada C hace 4 enlaces; H, F, Cl, Br hacen 1 (y los halógenos llevan 3 pares libres).</li><li>a) 2 C + 3 H + 1 Cl: ¿cómo dar 4 enlaces a cada C? Solo con un doble enlace: H₂C=CH–Cl.</li><li>b) 2 C enlazados; uno lleva los 3 F (dato): CF₃–; el otro completa con H, Br y Cl: <b>CF₃–CHBrCl</b>.</li><li>c) Cada C con un Cl (dato); 4 F repartidos: <b>ClF₂C–CF₂Cl</b>.</li><li>Dibuja 3 pares libres en cada halógeno.</li></ol></details></div>'},m2:{title:'Resonancia',objetivo:'<p>Vas a aprender que una sola estructura de Lewis a veces no alcanza, y cómo dibujar y comparar las estructuras alternativas (resonancia) que sí describen bien una molécula.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Electrones π</dt><dd>Los electrones del segundo y tercer enlace de un doble/triple enlace. Son más "móviles" que los de un enlace sencillo.</dd> <dt>Deslocalización</dt><dd>Electrones repartidos sobre varios átomos en lugar de fijos en uno.</dd> <dt>Contribuyente (estructura) de resonancia</dt><dd>Cada una de las estructuras de Lewis válidas que juntas describen una especie.</dd> <dt>Híbrido de resonancia</dt><dd>La especie real: un "promedio" de sus contribuyentes. Es más estable que cualquiera de ellos.</dd> <dt>Flecha curva</dt><dd>Flecha que muestra hacia dónde se mueve un <b>par de electrones</b> (sale del par y llega adonde se forma un enlace o un par nuevo). Es distinta de la flecha de doble punta ↔ entre contribuyentes.</dd> <dt>Isómero constitucional</dt><dd>Compuesto con la misma fórmula pero distinto orden de átomos (sustancia diferente; lo verás en el módulo 4).</dd></dl></div> <div class="b rule"><b class="t">Reglas</b><ol><li>Los <b>átomos no se mueven</b>; solo electrones π y pares libres.</li><li>Misma carga neta y mismo número de electrones en todas.</li><li>Ningún contribuyente rompe el octeto (C, N, O nunca con más de 8).</li></ol><b>Cuál pesa más en el híbrido:</b> 1) octetos completos; 2) menos cargas formales; 3) − en el átomo más electronegativo, + en el menos; 4) evita cargas iguales pegadas.</div>',intuicion:'<p><b>Idea en simple.</b> A veces una sola estructura de Lewis no basta: dibujas dos o más que difieren <i>solo</i> en la posición de electrones π o pares libres. No son especies distintas ni cambian entre sí: son "fotos" distintas del mismo objeto. Como un mulo (mezcla de caballo y burro) no es a veces caballo y a veces burro.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: catión alilo</b>H₂C⁺–CH=CH₂ ↔ H₂C=CH–CH₂⁺. Flecha curva: del enlace π hacia el C⁺, formando un nuevo π; el "hueco" (+) aparece en el otro extremo. Solo se movieron electrones ✔.</div>',profundizacion:'<div class="b err"><b class="t">Errores típicos</b>Mover un átomo (eso es isómero, no resonancia); dibujar C con 5 enlaces; poner flechas curvas que salen del H.</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>¿Un contribuyente con N de 5 enlaces es válido? <details><summary>Respuesta</summary>No: N (segundo periodo) no puede superar el octeto.</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <p>1.43–1.44: reconocer si son resonancia o sustancias distintas y evaluar estabilidad. 1.45–1.46: elegir el contribuyente más estable y dibujar flechas.</p> <div class="pb"><span class="id">1.43</span> Diazometano: A H₂C⁻–N⁺≡N: · B H₂C=N⁺=N⁻ · C H₂C⁺–N=N⁻ (cargas por recuento). <details><summary>Resolución paso a paso</summary><ol><li>Calcula la carga formal átomo por átomo (módulo 1). A: C tiene 3 enlaces + 1 par → −1; N central 4 enlaces → +1; N final 3 enlaces + 1 par → 0. B: C 4 enlaces → 0; N central +1; N final (2 enlaces + 2 pares) → −1. C: C con 3 enlaces, sin par → +1; N central (3 enlaces + 1 par) → 0; N final → −1.</li><li>a) Mismos átomos en el mismo orden y los mismos 16 e⁻ → <b>contribuyentes de resonancia</b>.</li><li>b) C⁻: A. c) C⁺: C. d) N⁺: A y B. e) N⁻: B y C. f) Carga neta 0 en las tres.</li><li>g) A vs B: ambas con octetos, pero B pone el − en N (más electronegativo) y A en C → <b>B más estable</b>.</li><li>h) B vs C: en C el carbono solo tiene 6 e⁻ → <b>B más estable</b>.</li><li>i) Geometría en el N central: A y B tienen 2 dominios → lineal; C tiene enlace sencillo, doble y un par → 3 dominios → angular ≈120° (ver módulo 3).</li></ol></details></div> <div class="pb"><span class="id">1.44</span> ¿Contribuyentes de una sola especie o sustancias distintas? (pares de estructuras N₃) <details><summary>Resolución paso a paso</summary><ol><li>Verifica que el orden de los átomos sea el mismo en ambas estructuras.</li><li>Cuenta electrones totales y carga neta en cada una: deben coincidir.</li><li>Comprueba que la segunda se obtiene de la primera moviendo solo pares (dibuja las flechas).</li><li>Si las tres condiciones se cumplen → resonancia. Si falla una (átomos reordenados, distinto número de e⁻ o carga distinta) → sustancias diferentes; nombra la regla que se rompe.</li></ol><i>Nota:</i> el PDF no conservó estas estructuras al extraer el texto; aplica los 4 pasos al dibujo original.</details></div> <div class="pb"><span class="id">1.45</span> a) ¿Cuál <i>no</i> es contribuyente permisible? b) Ordena los otros tres. c) Flechas curvas. <details><summary>Resolución paso a paso</summary><ol><li>Revisa cada estructura: octetos (¿algún N o C con 10 e⁻?), átomos en la misma posición y misma carga neta. La que falle es el inciso a).</li><li>Ordena las demás con las reglas de estabilidad: más octetos completos → menos cargas → − en O/N y + en el menos electronegativo.</li><li>Flechas: de un par libre del O⁻ (o de un π) hacia el átomo vecino que necesita electrones; una flecha por cada cambio de posición de un par.</li></ol>Aplica estos pasos a cada una de las estructuras A, B, C y D de tu enunciado.</details></div> <div class="pb"><span class="id">1.46</span> Contribuyente más estable con flechas curvas. <details><summary>Resolución paso a paso</summary><ol><li>Localiza una carga positiva o un átomo deficiente (C⁺ o C con 6 e⁻).</li><li>Busca al lado un par libre o un enlace π: es la fuente de electrones.</li><li>Mueve ese par hacia el sitio deficiente (una flecha) y compensa (otra flecha si un π se desplaza). La estructura mejora si desaparecen cargas o se completan octetos.</li></ol><div class="f">c) H₂C⁺–C̈H₂⁻ → H₂C=CH₂ d) H₂C⁺–CH=CH–C̈H₂⁻ → H₂C=CH–CH=CH₂ e) H₂C⁺–CH=CH–Ö:⁻ → H₂C=CH–CH=Ö f) H₂C⁻–CH=O → H₂C=CH–O⁻ (− pasa al O) g) H–C⁺=Ö: → H–C≡O⁺ (octetos completos) h) H₂C⁺–ÖH → H₂C=Ö⁺–H</div>Los incisos a, b e i siguen el mismo patrón que los resueltos arriba.</details></div>'},m3:{title:'Forma de las moléculas y polaridad',objetivo:'<p>Vas a aprender a predecir la forma 3D de una molécula a partir de su Lewis, y a saber si esa molécula es polar o no.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>RPECV (VSEPR)</dt><dd>Regla: los grupos de electrones alrededor de un átomo se repelen y se colocan lo más lejos posible.</dd> <dt>Dominio de electrones</dt><dd>Cada enlace (sencillo, doble o triple cuenta como <i>uno</i>) o par libre alrededor del átomo central.</dd> <dt>Geometría molecular</dt><dd>La forma que describen los <i>átomos</i> (no los pares libres) tras acomodar los dominios.</dd> <dt>Enlace polar</dt><dd>Enlace entre átomos de distinta electronegatividad: los electrones se desplazan hacia el más electronegativo (δ⁻); el otro queda δ⁺.</dd> <dt>Momento dipolar (μ)</dt><dd>Medida (en debyes, D) de la separación de carga; es un vector que apunta de δ⁺ a δ⁻ (en el texto: símbolo ⟼ del extremo + al −).</dd></dl></div> <div class="tw"><table><tr><th>Dominios</th><th>Sin pares libres</th><th>Con pares libres</th></tr><tr><td>2</td><td>Lineal 180°</td><td>—</td></tr><tr><td>3</td><td>Trigonal plana 120°</td><td>1 par → angular ≈120°</td></tr><tr><td>4</td><td>Tetraédrica 109.5°</td><td>1 par → piramidal; 2 pares → angular</td></tr></table></div>',intuicion:'<p><b>Idea en simple.</b> (1) Cuenta dominios → forma. (2) Ve qué enlaces son polares y dibuja sus flechas. (3) Suma las flechas como fuerzas: si se anulan por simetría, μ = 0; si no, la molécula es polar.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: CO₂ vs H₂O</b>CO₂: 2 dominios → lineal; los dos C=O apuntan en sentidos opuestos → se cancelan, μ = 0. H₂O: 4 dominios (2 pares libres) → angular; los dos O–H no se cancelan → μ ≈ 1.85 D.</div>',profundizacion:'<div class="b err"><b class="t">Error típico</b>Concluir "tiene enlaces polares, luego es polar". BF₃, CCl₄ y CO₂ tienen enlaces polares pero son apolares por simetría.</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>¿CH₃Cl es polar? <details><summary>Respuesta</summary>Sí: tetraedro asimétrico; el único enlace muy polar (C→Cl) no se cancela.</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <div class="pb"><span class="id">1.41 b, c</span> OCS: geometría y momento dipolar. <details><summary>Resolución paso a paso</summary><ol><li>C central con dos dobles enlaces = 2 dominios → <b>lineal</b>.</li><li>C=O y C=S son polares; O (3.5) es más electronegativo que S (2.5).</li><li>Los dos dipolos están en línea pero en sentidos opuestos y de <i>distinta magnitud</i> → no se cancelan.</li><li>Sí tiene μ (≈0.7 D); el extremo negativo es el O.</li></ol></details></div> <div class="pb"><span class="id">1.50</span> Extremos del dipolo: a) HCl b) HI c) H₂O d) HOCl <details><summary>Resolución paso a paso</summary>Compara electronegatividades (tabla del módulo 0): el más electronegativo es el extremo negativo. a) H(2.1)→Cl(3.0): Cl δ⁻. b) H(2.1)→I(2.5): I δ⁻ (diferencia pequeña). c) H→O en ambos enlaces. d) O–H: O δ⁻; O–Cl: O (3.5) &gt; Cl (3.0) → O δ⁻ en ambos, Cl δ⁺.</details></div> <div class="pb"><span class="id">1.51</span> FCl e ICl: mismo tamaño de μ, sentido opuesto. <details><summary>Resolución paso a paso</summary>F (4.0) &gt; Cl (3.0): en FCl el Cl es el extremo <b>positivo</b> (dipolo hacia F). Cl (3.0) &gt; I (2.5): en ICl el Cl es el extremo <b>negativo</b> (dipolo hacia Cl). El Cl cambia de papel según su pareja.</details></div> <div class="pb"><span class="id">1.52</span> ¿Cuál tiene mayor μ? <details><summary>Resolución paso a paso</summary>a) HF: mayor diferencia de electronegatividad que HCl. b) HF: BF₃ es trigonal plana, los tres B–F se cancelan (μ = 0). c) (CH₃)₃CCl: tiene un enlace C–Cl polar; el alcano casi no. d) CHCl₃: en CCl₃F el C–F se opone a tres C–Cl y se cancela en parte. e) CH₃OH: O más electronegativo que N. f) CH₃NO₂: el grupo NO₂ tiene cargas formales y es fuertemente polar (≈3.5 D).</details></div>'},m4:{title:'Fórmulas e isómeros',objetivo:'<p>Vas a aprender a pasar de una fórmula molecular a todas las moléculas distintas que puede representar, y a leer estructuras de líneas.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Fórmula molecular</dt><dd>Cuántos átomos de cada tipo hay: C₄H₁₀. No dice cómo están unidos.</dd> <dt>Fórmula estructural (condensada)</dt><dd>Muestra la conectividad: CH₃CH₂CH₂CH₃.</dd> <dt>Estructura de líneas</dt><dd>Dibujo abreviado: cada vértice o extremo es un C; los H del carbono no se escriben (se completan hasta 4 enlaces); los heteroátomos (O, N, Br…) sí, con sus H.</dd> <dt>Isómeros constitucionales</dt><dd>Misma fórmula molecular, distinto orden de enlace (son sustancias diferentes).</dd> <dt>Grado de insaturación (DI)</dt><dd>Número de anillos + enlaces π. DI = (2C + 2 + N − H − X)/2 (X = halógenos).</dd></dl></div>',intuicion:'<p><b>Idea en simple.</b> Con los mismos átomos se pueden armar "muebles" distintos. Para no perderte: (1) calcula el DI (¿cuántos anillos/dobles enlaces?), (2) dibuja los esqueletos de carbono de más lineal a más ramificado, (3) ubica el grupo funcional o el halógeno en cada posición que no se repita por simetría.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: C₄H₁₀</b>DI = (10+2−10)/2 = 0 → solo enlaces sencillos, sin anillos. Esqueletos: cadena de 4 C (CH₃CH₂CH₂CH₃) o cadena de 3 con un metilo en el centro ((CH₃)₃CH). Solo 2; cualquier otro dibujo repite uno de ellos.</div>',profundizacion:'<div class="b err"><b class="t">Error típico</b>Contar como isómeros dos dibujos del mismo compuesto girados o "doblados".</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>DI de C₃H₆O. <details><summary>Respuesta</summary>(6+2−6)/2 = 1: un anillo <i>o</i> un doble enlace (C=C o C=O).</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <div class="pb"><span class="id">1.47</span> Isómeros de a) C₄H₁₀ b) C₅H₁₂ c) C₂H₄Cl₂ d) C₄H₉Br e) C₃H₉N <details><summary>Resolución paso a paso</summary>Los cinco tienen DI = 0. a) 2 (butano, isobutano). b) 3 (pentano, 2-metilbutano, 2,2-dimetilpropano). c) 2 (1,1- y 1,2-dicloroetano: los Cl en el mismo C o en distinto). d) 4: dos esqueletos (lineal y ramificado) × posición del Br: 1-bromobutano, 2-bromobutano, 1-bromo-2-metilpropano, 2-bromo-2-metilpropano. e) 4 aminas: propilamina, isopropilamina, etilmetilamina, trimetilamina (el N puede llevar 1, 2 o 3 carbonos).</details></div> <div class="pb"><span class="id">1.48</span> Isómeros de a) C₃H₈ b) C₃H₆ c) C₃H₄ <details><summary>Resolución paso a paso</summary>a) DI 0: solo propano. b) DI 1: un π (propeno) o un anillo (ciclopropano). c) DI 2: un triple (propino), dos dobles (aleno, CH₂=C=CH₂) o anillo + doble (ciclopropeno).</details></div> <div class="pb"><span class="id">1.49</span> Isómeros de C₃H₆O a) solo enlaces sencillos b) un doble enlace. <details><summary>Resolución paso a paso</summary>DI = 1. a) Sin dobles enlaces, el DI es un <i>anillo</i>: ciclopropanol, oxetano (anillo de 4 con O), 2-metiloxirano. b) El doble enlace puede ser C=O: propanal, acetona; o C=C: alcohol alílico CH₂=CHCH₂OH, metil vinil éter CH₂=CH–O–CH₃ (y los enoles CH₃CH=CHOH, CH₂=C(OH)CH₃, poco estables).</details></div> <div class="pb"><span class="id">1.53</span> Redibuja mostrando todos los átomos y pares libres; fórmulas; ¿isómeros? <details><summary>Resolución paso a paso</summary><ol><li>Cuenta cada vértice y extremo = un C.</li><li>Añade H hasta que cada C tenga 4 enlaces (un doble enlace ya cuenta 2).</li><li>Añade heteroátomos con sus pares libres (O: 2 pares; N: 1; Br: 3).</li><li>Suma para la fórmula. Resultados identificables: d) 2-heptanona C₇H₁₄O; c) heptanol C₇H₁₆O; e) aspirina C₉H₈O₄; f) 6,6′-dibromoíndigo C₁₆H₈Br₂N₂O₂; a) y b) terpenos C₁₀H₁₆ (isómeros entre sí).</li></ol>Contrasta con las figuras originales.</details></div>'},m5:{title:'Ácidos y bases: pKa y equilibrio',objetivo:'<p>Vas a aprender a comparar qué tan fuerte es un ácido usando su pKa, y a predecir hacia dónde se inclina una reacción ácido-base antes de hacer cualquier cálculo.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Ácido de Brønsted-Lowry</dt><dd>Especie que <b>dona un protón</b> (H⁺).</dd> <dt>Base de Brønsted-Lowry</dt><dd>Especie que <b>acepta</b> un protón (usa un par libre para enlazarlo).</dd> <dt>Ácido / base conjugada</dt><dd>El ácido, al perder H⁺, se convierte en su base conjugada. La base, al ganarlo, se convierte en su ácido conjugado.</dd> <dt>Ka</dt><dd>Constante de equilibrio de un ácido en agua: qué tanto se disocia. Ka grande = ácido fuerte.</dd> <dt>pKa</dt><dd>pKa = −log Ka. Menor pKa = ácido más fuerte. Cada unidad de pKa = factor 10 en Ka.</dd> <dt>Equilibrio (K)</dt><dd>La reacción va y viene; K &gt; 1 significa que los productos dominan.</dd></dl></div> <div class="b rule"><b class="t">Fórmulas</b><div class="f">Ka = 10^(−pKa) K = Ka(ácido reactivo) / Ka(ácido producido) = 10^(pKa producido − pKa reactivo)</div></div> <div class="tw"><table><tr><th>Ácido</th><th>pKa aprox.</th><th>Base conjugada</th></tr><tr><td>H₃O⁺ / R–OH₂⁺</td><td>−1.7 / −2</td><td>H₂O / ROH</td></tr><tr><td>RCOOH</td><td>≈ 5</td><td>RCOO⁻</td></tr><tr><td>HCN / RSH / R₃NH⁺</td><td>≈ 9 / 10 / 10</td><td>CN⁻ / RS⁻ / R₃N</td></tr><tr><td>ROH, H₂O</td><td>16–18</td><td>RO⁻, OH⁻</td></tr><tr><td>alquino terminal, H α de éster</td><td>≈ 25</td><td>RC≡C⁻, enolato</td></tr><tr><td>R₂N–H, NH₃</td><td>36–38</td><td>R₂N⁻, NH₂⁻</td></tr></table></div> <p style="font-size:.85rem">Valores típicos (Evans/Ripin, Reusch, LibreTexts). Prevalece la tabla de pKa de tu libro de texto si sus valores difieren.</p> <p><b>Cómo predecir cuál es más ácido (pregunta siempre por la base conjugada):</b> 1) ¿el átomo con el H es más electronegativo o más grande? (S–H &gt; O–H &gt; N–H &gt; C–H); 2) ¿lleva carga +? → más ácido; 3) ¿la carga de la base conjugada se reparte por resonancia? → más ácido (RCOOH ≫ ROH); 4) hibridación: C(sp)–H &gt; C(sp²)–H &gt; C(sp³)–H.</p>',intuicion:'<p><b>Idea en simple.</b> Un ácido fuerte regala fácil su H⁺ porque su base conjugada queda muy cómoda (estable). Ácido fuerte ↔ base conjugada débil. En una reacción, el equilibrio se inclina hacia el lado del <b>ácido más débil</b> y la <b>base más débil</b>.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo resuelto: CH₃COOH + CH₃O⁻ →</b>La base toma el H⁺ ácido: CH₃COO⁻ + CH₃OH. Ácido reactivo: 4.8; ácido producido: 15.5. K = 10^(15.5 − 4.8) = 10^10.7 → equilibrio muy a la derecha (el ácido fuerte se consumió).</div>',profundizacion:'<div class="b err"><b class="t">Error típico</b>Restar al revés. Nemotecnia: siempre <i>producido − reactivo</i>. Si sale K &gt; 1, el ácido reactivo era el más fuerte.</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>Ka de A es 10⁴ veces la de B y pKa(B) = 6: ¿pKa(A)? <details><summary>Respuesta</summary>2 (más ácido = menor pKa).</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <div class="pb"><span class="id">1.55</span> a) pKa 2 vs 8: proporción de Ka. b) Ka difiere 10 000×; el más débil tiene pKa 5. <details><summary>Resolución paso a paso</summary>a) Ka₁/Ka₂ = 10^(8−2) = 10⁶: el de pKa 2 es 10⁶ veces más fuerte. b) 10 000 = 10⁴ → 4 unidades de pKa; el más fuerte tiene el pKa menor: 5 − 4 = <b>1</b>.</details></div> <div class="pb"><span class="id">1.56</span> Ka de aspirina 3.48, vitamina C 4.17, fórmico 3.75, oxálico 1.19; ordena. <details><summary>Resolución paso a paso</summary>Ka = 10^(−pKa): aspirina 3.3×10⁻⁴; vit. C 6.8×10⁻⁵; fórmico 1.8×10⁻⁴; oxálico 6.5×10⁻². Más ácido = mayor Ka: <b>oxálico &gt; aspirina &gt; fórmico &gt; vitamina C</b>.</details></div> <div class="pb"><span class="id">1.57</span> Ordena por acidez: oxonio cíclico (O⁺–H), pirrolidina (N–H), 1-metilciclopentanol (O–H), N-metilpirrolidinio (N⁺–H). <details><summary>Resolución paso a paso</summary>1) Busca el análogo en la tabla: R–OH₂⁺ (≈ −2), R₃NH⁺ (≈ 10), ROH (≈ 17), R₂N–H (≈ 36). 2) Menor pKa = más ácido: <b>oxonio &gt; amonio &gt; alcohol &gt; amina N–H</b>. Lógica: la carga + facilita perder H⁺; O es más electronegativo que N.</details></div> <div class="pb"><span class="id">1.58</span> Ordena por basicidad: alquinuro, alcóxido, tiolato, carboxilato. <details><summary>Resolución paso a paso</summary>Base fuerte = su ácido conjugado es débil (pKa alto): RC≡C⁻ (25) &gt; RO⁻ (16) &gt; RS⁻ (10) &gt; RCOO⁻ (5). El carboxilato es la más débil porque su carga se reparte en dos O.</details></div> <div class="pb"><span class="id">1.59</span> ¿Cuál solución 1.0 M es más básica? a) NaCN/NaF b) Na₂CO₃/CH₃COONa c) Na₂SO₄/NaSCH₃ <details><summary>Resolución paso a paso</summary>La base más fuerte tiene el ácido conjugado más débil. a) CN⁻ (HCN 9) vs F⁻ (HF 3) → <b>NaCN</b>. b) CO₃²⁻ (HCO₃⁻ ≈ 10) vs acetato (5) → <b>Na₂CO₃</b>. c) CH₃S⁻ (CH₃SH ≈ 10) vs SO₄²⁻ (HSO₄⁻ ≈ 2) → <b>NaSCH₃</b>.</details></div> <div class="pb"><span class="id">1.60</span> a) ¿Ácido más fuerte: (CH₃)₃NH⁺ o (CH₃)₃PH⁺? b) ¿Base más fuerte: (CH₃)₃N o (CH₃)₃P? <details><summary>Resolución paso a paso</summary>P es más grande que N: su enlace P–H es más largo y débil, y su par libre está más difuso. a) (CH₃)₃PH⁺ (pKa ≈ 9 vs ≈ 10). b) (CH₃)₃N.</details></div>'},m6:{title:'Mecanismo: reacciones ácido-base con flechas curvas',objetivo:'<p>Vas a aprender a dibujar, con flechas curvas, cómo se mueven los electrones cuando un ácido y una base reaccionan: el primer mecanismo de tu curso.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Mecanismo</dt><dd>Descripción paso a paso de cómo se mueven los electrones en una reacción.</dd> <dt>Flecha curva</dt><dd>Sale de un par de electrones (fuente) y apunta al lugar donde se formará el enlace o par (destino). Nunca sale de un átomo ni de un protón.</dd> <dt>Equilibrio ⇌</dt><dd>Doble flecha (dos medias puntas): la reacción es reversible.</dd></dl></div>',intuicion:'<p><b>Idea en simple.</b> En una transferencia de H⁺ hay dos flechas: (1) del par libre de la <b>base</b> al H del ácido; (2) del enlace H–A al átomo A (se vuelve par libre de la base conjugada).</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo: HCl + H₂O</b><div class="f">H₂Ö: + H–Cl  →  H₃O⁺ + :Cl̈:⁻</div>Flecha 1: par libre del O → H. Flecha 2: enlace H–Cl → Cl. Ácido conjugado del agua: H₃O⁺; base conjugada del HCl: Cl⁻.</div>',profundizacion:'<div class="b err"><b class="t">Error típico</b>Dibujar la flecha desde el H. Los que se mueven son electrones; el H es solo el destino.</div>',comprueba:'<div class="b rec"><b class="t">Comprueba</b>En NH₃ + H₂O ⇌ NH₄⁺ + OH⁻, ¿ácido conjugado de la base? <details><summary>Respuesta</summary>NH₄⁺.</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <div class="pb"><span class="id">1.61</span> Ácido + H₂O: a) HC≡N b) (CH₃CH₂)₂NH₂⁺ c) éster protonado CH₃C(=O⁺H)OCH₃. <details><summary>Resolución paso a paso</summary>Agua actúa como base: flecha 1 desde un par libre del O del agua al H ácido; flecha 2 desde el enlace X–H hasta X. a) HCN + H₂O ⇌ CN⁻ + H₃O⁺. b) Et₂NH₂⁺ + H₂O ⇌ Et₂NH + H₃O⁺. c) CH₃C(=O⁺–H)OCH₃ + H₂O ⇌ CH₃C(=O)OCH₃ + H₃O⁺. Dibuja todos los pares libres y las cargas formales del O.</details></div> <div class="pb"><span class="id">1.62</span> Base + H₂O: a) CH₃C≡C⁻ b) (CH₃CH₂)₂N⁻ c) figura. <details><summary>Resolución paso a paso</summary>Ahora el agua es el ácido: flecha 1 del par libre de la base al H del agua; flecha 2 del enlace O–H al O (queda OH⁻). a) CH₃C≡C⁻ + H₂O ⇌ CH₃C≡CH + OH⁻. b) Et₂N⁻ + H₂O ⇌ Et₂NH + OH⁻. c) sigue el mismo patrón que a) y b).</details></div> <div class="pb"><span class="id">1.63</span> Completa, identifica ácido/base/conjugados y calcula K: a) (CH₃)₃CO⁻ + H–SCH₃ b) carbonato + CH₃COOH c) [(CH₃)₂CH]₂N⁻ + HOCH(CH₃)₂ <details><summary>Resolución paso a paso</summary><ol><li>Las flechas dadas señalan qué H se transfiere y quién lo toma.</li><li>a) Ácido: CH₃SH (≈10); base: tBuO⁻. Producto: tBuOH (ácido conjugado, ≈17.5) + CH₃S⁻ (base conjugada). K = 10^(17.5−10) ≈ 3×10⁷.</li><li>b) Ácido: CH₃COOH (≈5); base: CO₃²⁻ → HCO₃⁻ (≈10) + CH₃COO⁻. K = 10^(10−5) = 10⁵.</li><li>c) Ácido: iPrOH (≈17); base: iPr₂N⁻ → iPr₂NH (≈36) + iPrO⁻. K = 10^(36−17) = 10¹⁹.</li></ol>Los tres K &gt; 1 (derecha), como dice el enunciado. Usa los pKa de tu material de referencia si difieren de los valores aproximados usados aquí.</details></div> <div class="pb"><span class="id">1.65</span> Productos, sentido del equilibrio y K: a) HC≡CH + NH₂⁻ b) HC≡CH + CH₃O⁻ c) CH₃COCH₂COCH₃ + CH₃O⁻ d) CH₃COOCH₂CH₃ + CH₃O⁻ e) CH₃COOCH₂CH₃ + iPr₂N⁻ <details><summary>Resolución paso a paso</summary><ol><li>Identifica el H más ácido del sustrato (alquino ≈ 26; CH₂ entre dos C=O ≈ 9; α-H del éster ≈ 25) y la base (CH₃O⁻: ácido conjugado CH₃OH 15.5; NH₂⁻: NH₃ 36; iPr₂N⁻: 36).</li><li>K = 10^(pKa del ácido producido − pKa del ácido reactivo).</li><li>a) HC≡C⁻ + NH₃: 10^(36−26) = 10¹⁰ → derecha. b) HC≡C⁻ + CH₃OH: 10^(15.5−26) = 10^−10.5 → izquierda. c) enolato + CH₃OH: 10^(15.5−9) = 10^6.5 → derecha. d) enolato + CH₃OH: 10^(15.5−25) = 10^−9.5 → izquierda. e) enolato + iPr₂NH: 10^(36−25) = 10¹¹ → derecha.</li></ol></details></div> <div class="pb"><span class="id">1.54</span> Montelukast: sitios ácido/básico; productos con 1 equiv. de NaOH y de HCl. <details><summary>Resolución paso a paso</summary><ol><li>Identifica grupos: carboxilato (COO⁻, dibujado desprotonado), quinolina protonada (N⁺–H), alcohol terciario, tioéter, alquenos/aromáticos.</li><li>a) Análogos de la tabla: N⁺–H tipo piridinio (≈5) es el H más ácido; ROH (≈17) mucho menos. El sitio más básico: COO⁻ (ácido conjugado ≈5).</li><li>b) 1 equiv. NaOH quita el H más ácido: N⁺–H → quinolina neutra; queda carboxilato de sodio.</li><li>c) 1 equiv. HCl protona la base más fuerte disponible: COO⁻ → COOH; el N⁺–H se mantiene (sal con Cl⁻).</li></ol></details></div>'},m7:{title:'Ácidos y bases de Lewis y deslocalización',objetivo:'<p>Vas a aprender la definición más general de ácido y base (Lewis), y por qué repartir una carga entre varios átomos hace que una especie sea más estable.</p>',concepto:'<div class="b voc"><b class="t">Palabras clave</b><dl> <dt>Base de Lewis</dt><dd>Especie que <b>dona</b> un par de electrones (siempre tiene un par libre o un π).</dd> <dt>Ácido de Lewis</dt><dd>Especie que <b>acepta</b> un par de electrones (tiene un "hueco").</dd> <dt>Nucleófilo / electrófilo</dt><dd>Base de Lewis que ataca un átomo de carbono / el átomo que recibe el ataque.</dd></dl></div>',intuicion:'<p><b>Idea en simple.</b> Lewis generaliza Brønsted: en Brønsted el que acepta el par es un H⁺; en Lewis puede ser cualquier átomo deficiente en electrones. Y como en el módulo 2: cuando una carga se reparte, la especie es más estable. Por eso RCOO⁻ (carga en 2 O) es una base mucho más débil que RO⁻.</p>',ejemplo:'<div class="b ex"><b class="t">Ejemplo</b>BF₃ (B con 6 e⁻) + :NH₃ → F₃B⁻–N⁺H₃. El par libre del N (base de Lewis) llena el hueco del B (ácido de Lewis).</div>',profundizacion:'',comprueba:'<div class="b rec"><b class="t">Comprueba</b>¿Por qué el ion guanidinio es tan estable? <details><summary>Respuesta</summary>La carga + se reparte por resonancia entre los tres N.</details></div>',aplicacion:'<h3>Contexto en el taller</h3> <div class="pb"><span class="id">1.64</span> Productos de (H₂N)₂C=S + CH₃Br (flechas dadas). <details><summary>Resolución paso a paso</summary>1) Fuente: par libre del S. 2) Destino: C del CH₃Br. 3) El enlace C–Br se rompe y sus electrones salen con Br⁻ (segunda flecha). Producto: [(H₂N)₂C=S⁺–CH₃] Br⁻. La tiourea es la base/nucleófilo de Lewis; el C del CH₃Br es el electrófilo.</details></div> <div class="pb"><span class="id">1.66</span> Ácido escuárico (pKa 1.2): base conjugada y flechas. <details><summary>Resolución paso a paso</summary>1) Quita el H⁺ de un OH: queda O⁻. 2) Flecha 1: par del O⁻ forma un enlace C=O. 3) Flecha 2: el π del C=C se desplaza. 4) Flecha 3: el π del C=O del otro lado sube al O como par libre. La carga − queda repartida en dos O → base conjugada muy estable → ácido inusualmente fuerte.</details></div> <div class="pb"><span class="id">1.67</span> Ácido conjugado de la guanidina: ¿A o B? <details><summary>Resolución paso a paso</summary>Dibuja la resonancia en cada uno. B: el H⁺ se añadió al N del =NH → (H₂N)₂C=NH₂⁺, con los tres N equivalentes: el + se reparte entre los tres. A: el N protonado tiene 4 enlaces y no tiene par para participar → sin deslocalización. Gana <b>B</b>.</details></div>'}};
